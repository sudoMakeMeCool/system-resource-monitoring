<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Dark Reader Mutation Storm</title>

<style>

body{
    margin:0;
    overflow:hidden;
}

.container{
    display:grid;
    grid-template-columns:repeat(50, 1fr);
}

.box{
    width:100%;
    height:20px;
}

</style>
</head>

<body>

<div class="container" id="container"></div>

<script>

const container = document.getElementById("container");
const boxes = [];

for(let i = 0; i < 5000; i++){

    const box = document.createElement("div");

    box.className = "box";

    box.style.backgroundColor =
        `rgb(
            ${Math.random()*255},
            ${Math.random()*255},
            ${Math.random()*255}
        )`;

    container.appendChild(box);

    boxes.push(box);
}

setInterval(() => {

    for(const box of boxes){

        box.style.backgroundColor =
            `rgb(
                ${Math.floor(Math.random()*256)},
                ${Math.floor(Math.random()*256)},
                ${Math.floor(Math.random()*256)}
            )`;
    }

}, 100);

</script>

</body>
</html>
